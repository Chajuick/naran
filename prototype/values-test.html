<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나란 · 가치관 검사 시험판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #ffffff; --card: #f2f4f6; --card-hover: #e8ebed; --text: #191f28; --sub: #6b7684; --sub2: #8b95a1;
    --line: #e5e8eb; --blue: #3182f6; --blue-soft: #e8f3ff; --red: #f04452; --red-soft: #ffeeee;
    --amber: #fe9800; --amber-soft: #fff4e0;
    /* 슬라이더 좌/우 */
    --left: #3182f6; --left-soft: #e8f3ff; --left-mid: #c9e2ff;
    --right: #f2780c; --right-soft: #fff1e4; --right-mid: #ffd9b3;
    /* MaxDiff */
    --neg: #f04452; --neg-soft: #ffeeee; --neg-mid: #ffd4d8;
    --pos: #03b26c; --pos-soft: #e5f8ef; --pos-mid: #b5ecd2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Pretendard, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  button { -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; min-height: 100vh; }
  .top { display: flex; align-items: center; gap: 12px; height: 44px; }
  .back { border: 0; background: none; font-size: 22px; color: var(--sub); cursor: pointer; padding: 4px 8px 4px 0; }
  .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--blue); transition: width .3s; }
  .count { font-size: 13px; color: var(--sub); min-width: 44px; text-align: right; }
  .part { font-size: 14px; color: var(--blue); font-weight: 600; margin: 28px 0 8px; }
  h1 { font-size: 26px; line-height: 1.38; margin: 8px 0 12px; font-weight: 700; letter-spacing: -0.02em; word-break: keep-all; }
  h2 { font-size: 21px; line-height: 1.45; margin: 0 0 24px; font-weight: 700; letter-spacing: -0.02em; word-break: keep-all; }
  .sit { font-size: 15px; color: var(--sub); margin: 0 0 6px; }
  p.lead { font-size: 16px; color: var(--sub); line-height: 1.6; word-break: keep-all; }
  .help { font-size: 14px; color: var(--sub); margin: -14px 0 16px; }

  /* 상황판단 선택지 */
  .opt { display: block; width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 10px; font: inherit; font-size: 16px; line-height: 1.5; color: var(--text); cursor: pointer; word-break: keep-all; transition: background .15s, transform .1s, box-shadow .15s; }
  .opt:hover { background: var(--blue-soft); box-shadow: inset 0 0 0 1.5px var(--left-mid); }
  .opt:active { transform: scale(.985); }
  .opt.sel { background: var(--blue-soft); color: var(--blue); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--blue); }

  /* 양극 슬라이더 */
  .poles { display: flex; gap: 10px; }
  .pole { flex: 1; border: 0; border-radius: 16px; padding: 16px 14px; font: inherit; font-size: 15px; line-height: 1.5; word-break: keep-all; cursor: pointer; text-align: left; transition: background .15s, box-shadow .15s, color .15s, transform .1s; }
  .pole:active { transform: scale(.98); }
  .pole.l { background: var(--left-soft); color: #1b4f9c; }
  .pole.r { background: var(--right-soft); color: #9a4a06; text-align: right; }
  .pole.l:hover { box-shadow: inset 0 0 0 1.5px var(--left); }
  .pole.r:hover { box-shadow: inset 0 0 0 1.5px var(--right); }
  .pole.l.on { background: var(--left); color: #fff; font-weight: 600; }
  .pole.r.on { background: var(--right); color: #fff; font-weight: 600; }
  .pole.l.half { box-shadow: inset 0 0 0 2px var(--left); font-weight: 600; }
  .pole.r.half { box-shadow: inset 0 0 0 2px var(--right); font-weight: 600; }
  .pole.dim { opacity: .45; }
  .dots { display: flex; justify-content: space-between; align-items: center; margin: 24px 6px 0; position: relative; }
  .dots::before { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--left-mid), var(--line) 45%, var(--line) 55%, var(--right-mid)); }
  .dot { position: relative; width: 30px; height: 30px; border-radius: 50%; background: #fff; cursor: pointer; padding: 0; transition: transform .12s, background .15s, box-shadow .15s; }
  .dot:hover { transform: scale(1.15); }
  .dot.l { border: 2px solid var(--left); }
  .dot.r { border: 2px solid var(--right); }
  .dot.m { border: 2px solid #c4cad0; width: 22px; height: 22px; }
  .dot.l.near, .dot.r.near { width: 24px; height: 24px; }
  .dot.l.sel { background: var(--left); box-shadow: 0 0 0 6px var(--left-soft); }
  .dot.r.sel { background: var(--right); box-shadow: 0 0 0 6px var(--right-soft); }
  .dot.m.sel { background: #8b95a1; border-color: #8b95a1; box-shadow: 0 0 0 6px var(--card); }
  .dothint { display: flex; justify-content: space-between; font-size: 12px; margin: 10px 0 0; }
  .dothint span:first-child { color: var(--left); } .dothint span:nth-child(2) { color: var(--sub2); } .dothint span:last-child { color: var(--right); }

  /* MaxDiff */
  .md-card { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; padding: 10px 10px 10px 16px; margin-bottom: 8px; font-size: 15px; line-height: 1.45; word-break: keep-all; transition: background .15s, box-shadow .15s; }
  .md-card .t { flex: 1; padding: 4px 0; }
  .md-card.neg { background: var(--neg-soft); box-shadow: inset 0 0 0 1.5px var(--neg); }
  .md-card.pos { background: var(--pos-soft); box-shadow: inset 0 0 0 1.5px var(--pos); }
  .md-btn { border: 0; border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, transform .1s; }
  .md-btn:active { transform: scale(.95); }
  .md-btn.neg { background: var(--neg-soft); color: var(--neg); }
  .md-btn.neg:hover { background: var(--neg-mid); }
  .md-btn.pos { background: var(--pos-soft); color: var(--pos); }
  .md-btn.pos:hover { background: var(--pos-mid); }
  .md-card.neg .md-btn.pos, .md-card.pos .md-btn.neg { background: rgba(255,255,255,.7); }
  .md-btn.neg.sel { background: var(--neg); color: #fff; }
  .md-btn.pos.sel { background: var(--pos); color: #fff; }
  .legend { display: flex; gap: 14px; font-size: 13px; margin: -8px 0 16px; }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .legend .n { color: var(--neg); } .legend .n::before { background: var(--neg); }
  .legend .p { color: var(--pos); } .legend .p::before { background: var(--pos); }
  .tie { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; font: inherit; font-size: 15px; text-align: left; cursor: pointer; word-break: keep-all; transition: background .15s, box-shadow .15s; }
  .tie:hover { box-shadow: inset 0 0 0 1.5px var(--neg); }
  .tie .no { flex: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; color: var(--sub2); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .tie.sel { background: var(--neg-soft); box-shadow: inset 0 0 0 1.5px var(--neg); }
  .tie.sel .no { background: var(--neg); color: #fff; }
  .tie.trait:hover { box-shadow: inset 0 0 0 1.5px var(--pos); }
  .tie.trait.sel { background: var(--pos-soft); box-shadow: inset 0 0 0 1.5px var(--pos); }
  .tie.trait.sel .no { background: var(--pos); }

  .flag { margin-top: 22px; }
  .flag-btn { border: 0; background: none; color: var(--sub); font: inherit; font-size: 14px; cursor: pointer; padding: 6px 0; }
  .flag-btn:hover { color: var(--amber); }
  .flag-btn.on { color: var(--amber); font-weight: 600; }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; font-size: 15px; min-height: 72px; resize: vertical; margin-top: 6px; }
  .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: linear-gradient(transparent, #fff 30%); }
  .cta button { display: block; width: 100%; max-width: 448px; margin: 0 auto; border: 0; border-radius: 16px; padding: 17px; font: inherit; font-size: 17px; font-weight: 600; background: var(--blue); color: #fff; cursor: pointer; transition: background .15s; }
  .cta button:hover:not(:disabled) { background: #1b64da; }
  .cta button:disabled { background: #d1d6db; cursor: default; }

  /* 결과 */
  .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 14px; font-size: 17px; }
  .hero { padding: 36px 4px 8px; }
  .hero .eyebrow { font-size: 15px; color: var(--sub); margin-bottom: 8px; }
  .hero h1 { font-size: 27px; margin: 0 0 6px; }
  .points { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 6px 20px; margin: 20px 0 12px; }
  .point { padding: 16px 0; border-top: 1px solid var(--line); }
  .point:first-child { border-top: 0; }
  .point .k { font-size: 13px; font-weight: 600; color: var(--sub2); margin-bottom: 4px; }
  .point .v { font-size: 16px; line-height: 1.6; word-break: keep-all; }
  .duo { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
  .duo .card { margin: 0; }
  .duo h3 { font-size: 15px; margin-bottom: 8px; }
  .duo ul { margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.65; word-break: keep-all; }
  .card.good { background: var(--pos-soft); } .card.good h3 { color: #02814f; }
  .card.care { background: var(--amber-soft); } .card.care h3 { color: #c56f00; }
  .sec { font-size: 20px; font-weight: 700; margin: 40px 0 6px; letter-spacing: -0.02em; }
  .sec-sub { font-size: 14px; color: var(--sub); margin: 0 0 16px; }
  .ax { background: #fff; border: 1px solid var(--line); border-radius: 20px; margin-bottom: 12px; overflow: hidden; }
  .ax-top { padding: 18px 20px 16px; background: var(--tint); }
  .ax-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--c); margin-bottom: 6px; }
  .ax-name::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .ax-band { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .ax-conf { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #fff; color: var(--c); margin-left: 6px; vertical-align: 2px; }
  .ax-desc { font-size: 15px; line-height: 1.6; color: #333d4b; word-break: keep-all; margin: 6px 0 16px; }
  .track { position: relative; height: 10px; background: rgba(255,255,255,.9); border-radius: 5px; }
  .track .fill { position: absolute; top: 0; height: 100%; background: var(--c); border-radius: 5px; opacity: .85; }
  .track .c { position: absolute; left: 50%; top: -3px; width: 2px; height: 16px; background: #c4cad0; transform: translateX(-1px); }
  .track .m { position: absolute; top: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--c); transform: translateX(-50%); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .poles-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--sub); margin-top: 8px; }
  .ev { padding: 6px 20px 14px; }
  .ev summary { cursor: pointer; font-size: 14px; color: var(--sub); padding: 10px 0; list-style: none; }
  .ev summary::-webkit-details-marker { display: none; }
  .ev summary::after { content: " ▾"; }
  .ev[open] summary::after { content: " ▴"; }
  .ev-item { padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.55; word-break: keep-all; }
  .ev-item .q { color: var(--sub); margin-bottom: 4px; }
  .ev-item .a { font-weight: 600; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: 4px; background: var(--tint); color: var(--c); white-space: nowrap; }
  .chip.zero { background: var(--card); color: var(--sub2); }
  .rank { list-style: none; margin: 0; padding: 0; counter-reset: r; }
  .rank li { counter-increment: r; display: flex; gap: 10px; align-items: baseline; padding: 7px 0; font-size: 15px; line-height: 1.5; word-break: keep-all; }
  .rank li::before { content: counter(r); flex: none; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 700; display: grid; place-items: center; background: var(--rc); color: #fff; }
  .rank.neg { --rc: var(--neg); } .rank.pos { --rc: var(--pos); } .rank.mute { --rc: #b0b8c1; }
  .sub-h { font-size: 13px; font-weight: 700; color: var(--sub); margin: 16px 0 4px; }
  .mirror-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; font-size: 14px; line-height: 1.5; padding: 4px 0; word-break: keep-all; }
  .mirror-row b { color: var(--sub); font-weight: 600; }
  .note { font-size: 13px; color: var(--sub); line-height: 1.6; }
  .dev { margin-top: 32px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .dev summary { cursor: pointer; font-size: 14px; color: var(--sub); padding: 10px 0; }
  .diff { font-size: 14px; line-height: 1.6; padding: 10px 0; border-top: 1px solid var(--line); }
  .diff b { display: block; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--amber-soft); color: var(--amber); margin-left: 6px; }
  .ghost { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font: inherit; font-size: 15px; font-weight: 600; background: var(--card); color: var(--text); cursor: pointer; margin-top: 10px; transition: background .15s; }
  .ghost:hover { background: var(--card-hover); }
  .ghost.primary { background: var(--blue); color: #fff; }
  .ghost.primary:hover { background: #1b64da; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="cta"><button id="next" disabled>다음</button></div>

<script>
// ───────── 축 정의 ─────────
const AXES = {
  RESP:   { name: '책임 축', L: '책임', R: '이해' },
  BOUND:  { name: '경계 축', L: '자율', R: '보살핌' },
  CANDOR: { name: '표현 축', L: '솔직', R: '조화' },
  EMO:    { name: '감정 축', L: '구분', R: '헤아림' },
};
// 시험 축 (채점·결과 표시 제외, 파일럿 데이터 수집용) — docs/04-axis3-redesign.md v0.6
const TRIAL_AXES = { SENIOR: { name: '수평 축(시험)', L: '수평', R: '연륜' } };
const POLE = {}; // 극 이름 → [축, 부호]
for (const [k, a] of Object.entries({ ...AXES, ...TRIAL_AXES })) { POLE[a.L] = [k, -1]; POLE[a.R] = [k, 1]; }

// ───────── 문항 (docs/02-items-values.md 원본) ─────────
// v0.4 — 판단 진술만, 부 가중치 없음, 🗨 조율 선택지는 해당 축 결측 처리. 근거: docs/05-full-test-validation.md
const ITEMS = {
  // ① 책임 ↔ 이해
  V01: { axis: 'RESP', type: 'sjt', q: '친구가 같은 약속을 두 번째 어겼다. 진심으로 미안하다고 한다.', opts: [
    ['진심으로 사과했다면 한 번 더 믿어주는 게 맞아요', [['이해', 2]]],
    ['사과가 진심이어도, 행동이 그대로라면 사과만으로는 부족해요', [['책임', 2]]],
    ['두 번째인 건 마음에 걸려도, 사과가 진심이라면 이번엔 믿어주는 쪽이 맞아요', [['이해', 1]]],
    ['사과는 받아도, 다음엔 그 친구가 먼저 행동으로 보여줘야 해요', [['책임', 1]]]] },
  V02: { axis: 'RESP', type: 'sjt', q: '함께 준비한 발표를 동료가 망쳤다. 알고 보니 전날 가족 일로 거의 잠을 못 잤다. 이 일을 두고 동료를 어떻게 보는 게 맞을까?', opts: [
    ['안타깝지만 맡은 일의 결과는 사정과 별개로 본인 몫이에요', [['책임', 2]]],
    ['사정은 이해해도 결과에 대한 책임이 사라지진 않아요', [['책임', 1]]],
    ['결과가 좋지 않았어도, 이번만큼은 그 사정을 더 무겁게 봐주는 게 맞아요', [['이해', 1]]],
    ['그런 사정이었다면 이번 결과로 그 사람을 판단하면 안 돼요', [['이해', 2]]]] },
  V03: { axis: 'RESP', type: 'slider', q: '친구가 내 일을 걱정하다가, 다른 친구에게 의논하면서 내가 털어놓은 비밀을 말했다.', L: ['좋은 뜻이었어도 비밀을 말한 책임은 그대로예요', '책임'], R: ['걱정해서 그랬다면 어느 정도는 이해할 수 있는 일이에요', '이해'] },
  V04: { axis: 'RESP', type: 'slider', q: '동료가 다른 급한 업무를 먼저 처리하느라, 함께 맡은 일의 마감을 놓쳤다.', L: ['급한 일이 있었다면 책임을 묻기 어려운 일이에요', '이해'], R: ['이유가 있어도 마감을 놓친 책임은 남아요', '책임'] },
  // ② 자율 ↔ 보살핌
  V05: { axis: 'BOUND', type: 'sjt', q: '친한 친구가 무리하게 대출을 받아 창업하려 한다. 여러 번 말렸지만 마음을 바꾸지 않는다.', opts: [
    ['충분히 말했다면, 그다음은 그 친구가 정할 일이에요', [['자율', 2]]],
    ['충분히 말했어도, 가까운 사이라면 한 번 더 막아보는 게 도리예요', [['보살핌', 2]]],
    ['결정은 존중하되, 위험을 줄일 방법은 계속 같이 찾아줘야 해요', [['보살핌', 1]]],
    ['걱정은 남아도, 결정을 존중하고 도움은 그 친구가 청할 때 주는 게 맞아요', [['자율', 1]]]] },
  V06: { axis: 'BOUND', type: 'sjt', q: '친한 친구가 한동안 연락이 뜸하더니 "요즘 좀 혼자 있고 싶어"라고만 한다.', opts: [
    ['이유를 묻지 않고 혼자 둬주는 게 존중이에요', [['자율', 2]]],
    ['걱정되더라도 혼자 있고 싶다는 말을 먼저 존중하고, 필요하면 연락하라고 한 번 말해두는 게 맞아요', [['자율', 1]]],
    ['혼자 두더라도, 괜찮은지는 한 번 확인하는 게 가까운 사이의 몫이에요', [['보살핌', 1]]],
    ['가까운 사이라면 무슨 일인지 알 때까지 곁에서 챙기는 게 맞아요', [['보살핌', 2]]]] },
  V07: { axis: 'BOUND', type: 'sjt', q: '동생이 건강검진에서 재검 판정을 받았는데, 바쁘다며 병원을 계속 미룬다.', opts: [
    ['몇 번 권했다면, 그다음은 본인이 정할 몫이에요', [['자율', 2]]],

  const flagged = Object.entries(S.flags).filter(([, v]) => v);
  const mins = Math.round((Date.now() - S.start) / 60000);
  const itemLabel = k => ITEMS[k] ? `${k} ${(isGeneric(ITEMS[k].q) ? ITEMS[k].L[0] : ITEMS[k].q).slice(0, 28)}…` : k.endsWith('Tie') ? `${k.startsWith('vice') ? '2부' : '4부'} 순위 정하기` : `${k.startsWith('vice') ? '2부' : '4부'} 카드 ${+k.replace(/\D/g, '') + 1}번째 화면`;

  const axisCard = k => {
    const a = AXES[k], r = ax[k], st = AXIS_STYLE[k], pos = 50 + r.score / 2;
    const ids = ORDER.filter(id => ITEMS[id].axis === k && S.ans[id] !== undefined);
    return `<div class="ax" style="--c:${st.c};--tint:${st.tint}">
      <div class="ax-top">
        <div class="ax-name">${a.name} · ${a.L} ↔ ${a.R}</div>
        <div class="ax-band">${r.band}<span class="ax-conf">${r.conf}</span></div>
        <p class="ax-desc">${r.desc}</p>
        <div class="track"><span class="fill" style="left:${Math.min(50, pos)}%;width:${Math.abs(pos - 50)}%"></span><span class="c"></span><span class="m" style="left:${pos}%"></span></div>
        <div class="poles-row"><span>${a.L}</span><span>${a.R}</span></div>
      </div>
      <details class="ev"><summary>이렇게 답했어요 (${ids.length}문항)</summary>
        ${ids.map(id => { const s = signedOnAxis(id, S.ans[id]); const it = ITEMS[id];
          return `<div class="ev-item"><div class="q">${esc(isGeneric(it.q) ? '두 생각 중에서' : it.q)}</div><div class="a">${esc(answerShort(id, S.ans[id]))}
          <span class="chip ${s === 0 ? 'zero' : ''}">${s === 0 ? '중간' : `${s < 0 ? a.L : a.R} ${Math.abs(s)}`}</span></div></div>`; }).join('')}
      </details></div>`;
  };
  const mirrorRows = [['O4', 'M4', '바빠서 반나절 연락이 없던 일'], ['V03', 'M1', '비밀을 옮긴 일'], ['V04', 'M2', '몸살로 마감을 놓친 일'], ['V16', 'M3', '"솔직히 별로야"라고 한 일']]
    .filter(([o, m]) => S.ans[o] !== undefined && S.ans[m] !== undefined)
    .map(([o, m, t]) => `<div class="ev-item"><div class="q">${t}</div>
      <div class="mirror-row"><b>남이 하면</b><span>${esc(answerShort(o, S.ans[o]))}</span></div>
      <div class="mirror-row"><b>내가 하면</b><span>${esc(answerShort(m, S.ans[m]))}</span></div></div>`).join('');

  $app.innerHTML = `
    <div class="hero"><div class="eyebrow">나란 이런 사람</div><h1>${N.headline}</h1>
      <p class="note" style="margin:10px 0 0">이 결과는 내가 <b>무엇이 옳다고 보는지</b>예요. 실제로 어떻게 행동하는지와는 다를 수 있어요.</p></div>
    <div class="points">${N.points.map(([k, v]) => `<div class="point"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
    <div class="duo">
      <div class="card good"><h3>이럴 때 빛나요</h3><ul>${N.good.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      <div class="card care"><h3>이런 건 조심해요</h3><ul>${N.care.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
    </div>

    <div class="sec">이렇게 나온 이유</div>
    <p class="sec-sub">각 축을 눌러 내가 한 답을 확인할 수 있어요.</p>
    ${Object.keys(AXES).map(axisCard).join('')}

    <div class="card"><h3>가장 거슬리는 것</h3>
      <ol class="rank neg">${vices.slice(0, 3).map(([id]) => `<li>${esc(VICES[id][0])}</li>`).join('')}</ol>
      <div class="sub-h">비교적 덜 거슬리는 것</div>
      <ol class="rank mute">${vices.slice(-3).reverse().map(([id]) => `<li>${esc(VICES[id][0])}</li>`).join('')}</ol></div>
    <div class="card"><h3>사람을 볼 때 중요한 것</h3>
      <ol class="rank pos">${traits.filter(([, v]) => v > 0).slice(0, 3).map(([id]) => `<li>${esc(TRAITS[id][0])}</li>`).join('')}</ol>
      <div class="sub-h">덜 중요하게 보는 것</div>
      <ol class="rank mute">${traits.slice(-3).reverse().map(([id]) => `<li>${esc(TRAITS[id][0])}</li>`).join('')}</ol></div>
    <div class="card"><h3>공정 · 같은 기준</h3>
      <div class="mirror-row" style="grid-template-columns:110px 1fr"><b>이중잣대가 거슬리는 정도</b><span>${FA.vLabel}</span></div>
      <div class="mirror-row" style="grid-template-columns:110px 1fr"><b>"같은 기준"인 사람을</b><span>${FA.tLabel}</span></div>
      <div class="mirror-row" style="grid-template-columns:110px 1fr"><b>실제로 쓰는 기준</b><span>${mi.label}${mi.note || ''}</span></div>
      <details class="ev" style="padding:4px 0 0"><summary>입장 바꿔 답한 것 보기</summary>${mirrorRows}</details></div>

    <p class="note">※ 시험판이에요. 점수 기준과 문장은 임시예요.</p>
    <button class="ghost primary cta-inline" onclick="copyResult()">결과 복사해서 Claude에게 보내기</button>
    <button class="ghost" onclick="resetAll()">처음부터 다시</button>

    <details class="dev"><summary>개발용 · 시험 축 <span class="tag">수평↔연륜 ${TS.label} (${TS.raw})</span> · Claude 예상과 비교 <span class="tag">다른 답 ${diffs.length}</span>${flagged.length ? `<span class="tag">애매 ${flagged.length}</span>` : ''}</summary>
      ${diffs.map(id => `<div class="diff"><b>${id} · ${esc(isGeneric(ITEMS[id].q) ? ITEMS[id].L[0] : ITEMS[id].q)}</b>내 답: ${esc(answerText(id, S.ans[id]))}<br><span class="note">예상: ${esc(answerText(id, PREDICT[id]))}</span></div>`).join('')}
      ${flagged.map(([k, v]) => `<div class="diff"><b>⚑ ${esc(itemLabel(k))}</b>${esc(v.trim() || '(메모 없음)')}</div>`).join('')}
    </details>`;

  window.copyResult = () => {
    const L = [`[나란 가치검사 시험판 결과] 소요 약 ${mins}분`, '', `■ 헤드라인: ${N.headline.replace('<br>', ' ')}`];
    N.points.forEach(([k, v]) => L.push(`- ${k}: ${v}`));
    L.push('', '■ 5축');
    for (const [k, a] of Object.entries(AXES)) L.push(`- ${a.name}(${a.L}↔${a.R}): ${ax[k].band} / ${ax[k].conf} / 점수 ${Math.round(ax[k].score)}`);
    L.push('', '■ 거슬리는 순위: ' + vices.map(([id, s]) => `${VICES[id][1]}(${+s.toFixed(2)})`).join(', '));
    L.push('■ 사람 볼 때 순위: ' + traits.map(([id, s]) => `${TRAITS[id][0]}(${+s.toFixed(2)})`).join(', '));
    { const di = dialogIndex(); L.push(`■ 조율 지향: ${di.n}/${di.of} (${di.picked.join(',')})`); }
    L.push(`■ 공정 카드: ${FA.summary} / 이중잣대 ${FA.vS} · 같은 기준 ${FA.tS}`);
    L.push(`■ 기준 일관성: ${mi.label} (d=${mi.d.toFixed(2)}, 쌍별 ${mi.ds.join('/')})`);
    L.push(`■ 시험 축 수평↔연륜 (비채점): ${TS.label} 원점수 ${TS.raw} (${TS.n}/4문항, −는 수평) · ${TRIAL.map(id => `${id}=${S.ans[id] === undefined ? '-' : ITEMS[id].type === 'sjt' ? 'ABCD'[S.ans[id]] : S.ans[id]}`).join(' ')}`);
    L.push('', `■ 예상과 다른 답 ${diffs.length}개`);
    diffs.forEach(id => L.push(`- ${id} 내 답: ${answerText(id, S.ans[id])} | 예상: ${answerText(id, PREDICT[id])}`));
    L.push('', `■ 애매 표시 ${flagged.length}개`);
    flagged.forEach(([k, v]) => L.push(`- ${itemLabel(k)}: ${v.trim() || '(메모 없음)'}`));
    L.push('', '■ 전체 응답');
    L.push(Object.entries(S.ans).map(([k, v]) => `${k}=${ITEMS[k].type === 'sjt' ? 'ABCD'[v] : v}`).join(' '));
    L.push(Object.entries(S.md).map(([k, m]) => k.endsWith('Tie') ? `${k}: ${m.picks.join('>')}` : `${k}: 최악 ${m.w} / 최선 ${m.b}`).join(' | '));
    const text = L.join('\n');
    navigator.clipboard.writeText(text).then(() => {
      document.querySelector('.cta-inline').textContent = '복사했어요 · Claude에게 붙여넣어 주세요';
    }).catch(() => { prompt('아래 내용을 복사해 주세요', text); });
  };
  window.resetAll = () => { S = { step: 0, ans: {}, md: {}, flags: {}, start: Date.now(), dir: 1, perm: {} }; save(); render(); };
}

render();
</script>
</body>
</html>
